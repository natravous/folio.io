<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Folio — EPUB Reader</title>
  <meta name="description" content="A private EPUB reader that runs entirely in your browser and works offline.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%0A%20%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%230b57d0%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M256%20150c-38-26-88-34-136-30v226c48-4%2098%204%20136%2030%2038-26%2088-34%20136-30V120c-48-4-98%204-136%2030z%22%20fill%3D%22%23fff%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M256%20150v226%22%20stroke%3D%22%230b57d0%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E" type="image/svg+xml">
  <style>
:root {
  --bg: #ffffff;
  --surface: #f5f5f4;
  --surface-2: #ebeae7;
  --fg: #1d1d1f;
  --muted: #6b6b70;
  --border: #dedcd7;
  --accent: #0b57d0;
  --accent-fg: #ffffff;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.14), 0 2px 6px rgba(0, 0, 0, 0.08);
  --radius: 12px;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}

:root[data-theme="sepia"] {
  --bg: #f6efe1;
  --surface: #ede3cf;
  --surface-2: #e3d6bd;
  --fg: #4b3b2a;
  --muted: #8a7558;
  --border: #d9c9a9;
  --accent: #8a4b14;
  --accent-fg: #fff8ee;
}

:root[data-theme="grey"] {
  --bg: #3a3b3f;
  --surface: #44454a;
  --surface-2: #505257;
  --fg: #ecebe7;
  --muted: #b3b1ab;
  --border: #55575c;
  --accent: #a8c7fa;
  --accent-fg: #10213d;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

:root[data-theme="dark"] {
  --bg: #16171a;
  --surface: #202226;
  --surface-2: #2a2d32;
  --fg: #e3e1dc;
  --muted: #9a9892;
  --border: #33363c;
  --accent: #8ab4f8;
  --accent-fg: #0d1b33;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.icon {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

.view { min-height: 100%; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn-primary:hover { filter: brightness(1.08); }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 10px;
  background: transparent;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn[aria-expanded="true"] { background: var(--surface-2); }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
}
.pill .icon { width: 14px; height: 14px; }

/* ---------- Library ---------- */

.lib-header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px max(16px, env(safe-area-inset-left));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
.brand-icon { width: 24px; height: 24px; color: var(--accent); }
.lib-actions { display: flex; align-items: center; gap: 10px; }

.lib-main { padding: 24px 16px 48px; max-width: 1200px; margin: 0 auto; }

.empty {
  max-width: 460px;
  margin: 10vh auto 0;
  text-align: center;
  padding: 40px 24px;
  border: 2px dashed var(--border);
  border-radius: 20px;
}
.empty-icon { width: 48px; height: 48px; color: var(--muted); stroke-width: 1.5; }
.empty h2 { margin: 12px 0 8px; font-size: 20px; }
.empty p { color: var(--muted); line-height: 1.55; margin: 0 0 20px; }
.empty code { font-size: 0.95em; }

.grid {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 28px 20px;
}
@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; }
}

.card { position: relative; display: flex; flex-direction: column; min-width: 0; }
.card-open {
  display: block;
  padding: 0;
  border: 0;
  background: none;
  text-align: left;
  border-radius: 8px;
}
.cover {
  position: relative;
  aspect-ratio: 2 / 3;
  border-radius: 6px;
  overflow: hidden;
  background: var(--surface-2);
  box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 6px 16px rgba(0,0,0,.12);
  transition: transform .15s ease, box-shadow .15s ease;
}
.card-open:hover .cover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(0,0,0,.14), 0 12px 24px rgba(0,0,0,.18); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-fallback {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 14px 12px;
  color: #fff;
  font-family: Georgia, "Times New Roman", serif;
}
.cover-fallback .cf-title { font-size: 16px; line-height: 1.25; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
.cover-fallback .cf-author { font-size: 12px; opacity: .85; }
.card-meta { padding-top: 10px; min-width: 0; }
.card-title { font-size: 14px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card-author { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-progress { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--muted); }
.bar { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.card-delete {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 0;
  display: grid;
  place-items: center;
  background: rgba(0, 0, 0, .55);
  color: #fff;
  opacity: 0;
  transition: opacity .15s;
}
.card-delete .icon { width: 16px; height: 16px; }
.card:hover .card-delete, .card-delete:focus-visible { opacity: 1; }
@media (hover: none) { .card-delete { opacity: .85; } }

/* ---------- Reader ---------- */

#reader-view {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  background: var(--bg);
}

.reader-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px max(8px, env(safe-area-inset-left));
  padding-top: max(4px, env(safe-area-inset-top));
  border-bottom: 1px solid var(--border);
  min-height: 52px;
}
.reader-title { flex: 1; min-width: 0; text-align: center; padding: 0 8px; }
.t-book { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-chapter { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.reader-body { flex: 1; display: flex; min-height: 0; }
/* The area beside the page turns pages. user-select: none stops a click or drag
   there from selecting the page frame itself (it showed as a blue overlay). */
.reader-body { -webkit-user-select: none; user-select: none; }
.viewer { position: relative; flex: 1; min-width: 0; overflow: hidden; display: flex; justify-content: center; cursor: pointer; }
.reader-frame { cursor: auto; display: block; flex: none; border: 0; width: 100%; height: 100%; background: var(--bg); }

.side-btn {
  flex: none;
  width: 48px;
  border: 0;
  background: transparent;
  color: var(--muted);
  display: grid;
  place-items: center;
  opacity: .55;
  transition: opacity .15s, background .15s;
}
.side-btn:hover { opacity: 1; background: var(--surface); }
.side-btn .icon { width: 26px; height: 26px; }
@media (max-width: 700px) { .side-btn { display: none; } }

.reader-foot {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 16px;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  min-height: 44px;
}
.foot-text { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
#page-info { min-width: 90px; cursor: default; }
.foot-pct { min-width: 36px; text-align: right; }
#progress { flex: 1; accent-color: var(--accent); min-width: 60px; }
@media (max-width: 480px) { #page-info { display: none; } }

.loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; }
.spinner {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 3px solid var(--surface-2);
  border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.28); z-index: 9; }

.drawer, .popover {
  position: absolute;
  z-index: 10;
  background: var(--bg);
  color: var(--fg);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}
.drawer {
  top: 0;
  bottom: 0;
  left: 0;
  width: min(360px, 88vw);
  border-right: 1px solid var(--border);
  animation: slide-in .18s ease-out;
}
@keyframes slide-in { from { transform: translateX(-100%); } }
.popover {
  top: 56px;
  right: 12px;
  width: min(340px, calc(100vw - 24px));
  max-height: calc(100dvh - 72px);
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding-bottom: 12px;
  animation: pop .14s ease-out;
}
@keyframes pop { from { opacity: 0; transform: translateY(-6px); } }

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 8px 6px 18px;
}
.panel-head h2 { margin: 0; font-size: 15px; }

.toc { overflow-y: auto; padding: 4px 8px 24px; flex: 1; }
.toc ul { list-style: none; margin: 0; padding: 0; }
.toc ul ul { padding-left: 14px; }
.toc button {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 9px 10px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.35;
}
.toc button:hover { background: var(--surface); }
.toc button.active { background: var(--surface-2); font-weight: 600; color: var(--accent); }
.toc button:disabled { opacity: .5; cursor: default; }

.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 18px; }
.field .label { font-size: 13px; color: var(--muted); }
.field select {
  min-width: 0;
  max-width: 190px;
  padding: 7px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 13px;
}
.field.check { justify-content: flex-start; font-size: 14px; cursor: pointer; }
.field.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.segmented { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 2px; }
.segmented button { border: 0; background: transparent; padding: 6px 8px; border-radius: 7px; font-size: 13px; }
.segmented button[aria-pressed="true"] { background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: 600; }

.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 44px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; }
.stepper output { min-width: 48px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }

/* ---------- Drop & toasts ---------- */

.drop-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: blur(4px);
  pointer-events: none;
}
.drop-box {
  padding: 40px 56px;
  border: 3px dashed var(--accent);
  border-radius: 20px;
  text-align: center;
  color: var(--accent);
  font-weight: 600;
}
.drop-box .icon { width: 40px; height: 40px; }

.toasts {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  width: max-content;
  max-width: calc(100vw - 32px);
}
.toast {
  background: var(--fg);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  box-shadow: var(--shadow);
  animation: pop .15s ease-out;
}
.toast.error { background: #b3261e; color: #fff; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
    <symbol id="i-toc" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V5h11v2M9.5 5v14M7 19h5M14 12v-1.5h7V12M17.5 10.5V19M16 19h3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 004 20.5zM4 20.5A2.5 2.5 0 006.5 23H20v-5"/></symbol>
    <symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M3 3l18 18M8 8a5 5 0 00-1 9.9h10M17.8 17.6A4 4 0 0016 10h-1.3a7 7 0 00-6.3-4.9"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  </svg>

  <!-- Library -->
  <section id="library-view" class="view" aria-label="Library">
    <header class="lib-header">
      <div class="brand">
        <svg class="icon brand-icon"><use href="#i-book"/></svg>
        <h1>Folio</h1>
      </div>
      <div class="lib-actions">
        <span id="offline-status" class="pill" hidden></span>
        <label class="btn btn-primary" for="file-input">
          <svg class="icon"><use href="#i-plus"/></svg><span>Add books</span>
        </label>
        <input id="file-input" type="file" accept=".epub,application/epub+zip" multiple hidden>
      </div>
    </header>

    <main class="lib-main">
      <div id="empty-state" class="empty" hidden>
        <svg class="icon empty-icon"><use href="#i-book"/></svg>
        <h2>Your library is empty</h2>
        <p>Drop <code>.epub</code> files anywhere on this page, or choose them from your device. Books are stored only in this browser and stay readable offline.</p>
        <label class="btn btn-primary" for="file-input"><svg class="icon"><use href="#i-plus"/></svg><span>Choose EPUB files</span></label>
      </div>
      <ul id="book-grid" class="grid" aria-label="Books"></ul>
    </main>
  </section>

  <!-- Reader -->
  <section id="reader-view" class="view" aria-label="Reader" hidden>
    <header class="reader-bar">
      <button id="btn-library" class="icon-btn" aria-label="Back to library" title="Library"><svg class="icon"><use href="#i-back"/></svg></button>
      <button id="btn-toc" class="icon-btn" aria-label="Table of contents" title="Contents (T)" aria-expanded="false" aria-controls="toc-panel"><svg class="icon"><use href="#i-toc"/></svg></button>
      <div class="reader-title">
        <div id="book-title" class="t-book"></div>
        <div id="chapter-title" class="t-chapter"></div>
      </div>
      <button id="btn-settings" class="icon-btn" aria-label="Reading settings" title="Settings" aria-expanded="false" aria-controls="settings-panel"><svg class="icon"><use href="#i-type"/></svg></button>
    </header>

    <div class="reader-body">
      <button id="btn-prev" class="side-btn" aria-label="Previous page"><svg class="icon"><use href="#i-back"/></svg></button>
      <div id="viewer" class="viewer">
        <div id="viewer-loading" class="loading" hidden><div class="spinner"></div></div>
      </div>
      <button id="btn-next" class="side-btn" aria-label="Next page"><svg class="icon"><use href="#i-next"/></svg></button>
    </div>

    <footer class="reader-foot">
      <span id="page-info" class="foot-text"></span>
      <input id="progress" type="range" min="0" max="1000" value="0" aria-label="Book progress">
      <span id="progress-text" class="foot-text foot-pct">0%</span>
    </footer>

    <aside id="toc-panel" class="drawer" aria-label="Table of contents" hidden>
      <div class="panel-head">
        <h2>Contents</h2>
        <button class="icon-btn" data-close aria-label="Close contents"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <nav id="toc-list" class="toc"></nav>
    </aside>

    <aside id="settings-panel" class="popover" aria-label="Reading settings" hidden>
      <div class="panel-head">
        <h2>Display</h2>
        <button class="icon-btn" data-close aria-label="Close settings"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>

      <div class="field">
        <span class="label">Theme</span>
        <div class="segmented" data-setting="theme">
          <button data-value="auto">Auto</button>
          <button data-value="light">Light</button>
          <button data-value="sepia">Sepia</button>
          <button data-value="grey">Grey</button>
          <button data-value="dark">Dark</button>
        </div>
      </div>

      <div class="field">
        <span class="label">Text size</span>
        <div class="stepper">
          <button id="font-smaller" aria-label="Smaller text">A−</button>
          <output id="font-size-value">100%</output>
          <button id="font-larger" aria-label="Larger text">A+</button>
        </div>
      </div>

      <div class="field">
        <label class="label" for="set-font">Font</label>
        <select id="set-font" data-setting="fontFamily">
          <option value="publisher">Publisher default</option>
          <option value="serif">Serif</option>
          <option value="sans">Sans-serif</option>
          <option value="dyslexic">Rounded (readability)</option>
        </select>
      </div>

      <div class="field">
        <label class="label" for="set-line">Line spacing</label>
        <select id="set-line" data-setting="lineHeight">
          <option value="publisher">Publisher default</option>
          <option value="1.3">Compact</option>
          <option value="1.55">Comfortable</option>
          <option value="1.8">Relaxed</option>
          <option value="2.1">Loose</option>
        </select>
      </div>

      <div class="field">
        <label class="label" for="set-margins">Margins</label>
        <select id="set-margins" data-setting="margins">
          <option value="narrow">Narrow</option>
          <option value="normal">Normal</option>
          <option value="wide">Wide</option>
        </select>
      </div>

      <div class="field">
        <span class="label">Layout</span>
        <div class="segmented" data-setting="flow">
          <button data-value="paginated">Pages</button>
          <button data-value="scrolled">Scroll</button>
        </div>
      </div>

      <div class="field">
        <span class="label">Page width</span>
        <div class="segmented" data-setting="pageWidth">
          <button data-value="normal" title="Book-shaped pages, centred">Normal</button>
          <button data-value="wide" title="Pages fill the whole window">Wide</button>
        </div>
      </div>

const THEME_COLORS = { light: '#ffffff', sepia: '#f6efe1', grey: '#3a3b3f', dark: '#16171a' };

let settings = loadSettings();
let current = null; // { id, meta, book, reader, cumulative, tocFlat }
let coverUrls = [];
let saveTimer = null;
let warnedNotPersistent = false;

// ---------- Settings ----------

function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem('folio-settings') || '{}');
    // v2 made Grey the default theme: books with white or pale text were
    // unreadable on the old white default, so move Auto/Light users over once.
    if ((saved.version || 1) < 2 && (saved.theme === 'auto' || saved.theme === 'light')) saved.theme = 'grey';
    return { ...DEFAULT_SETTINGS, ...saved, version: SETTINGS_VERSION };
  } catch {
    return { ...DEFAULT_SETTINGS };
  }
}

function saveSettings() {
  try { localStorage.setItem('folio-settings', JSON.stringify(settings)); } catch { /* storage unavailable */ }
}

function applyAppTheme() {
  const theme = resolveTheme(settings.theme);
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').setAttribute('content', THEME_COLORS[theme]);
}

function syncSettingsUI() {
  for (const group of document.querySelectorAll('.segmented[data-setting]')) {
    for (const btn of group.querySelectorAll('button')) {
      btn.setAttribute('aria-pressed', String(btn.dataset.value === settings[group.dataset.setting]));
    }
  }
  for (const select of document.querySelectorAll('select[data-setting]')) {
    select.value = settings[select.dataset.setting];
  }
  for (const box of document.querySelectorAll('input[type="checkbox"][data-setting]')) {
    box.checked = !!settings[box.dataset.setting];
  }
  $('font-size-value').textContent = `${settings.fontSize}%`;
}

function updateSetting(key, value) {
  settings = { ...settings, [key]: value };
  saveSettings();
  syncSettingsUI();
  applyAppTheme();
  if (current) current.reader.applySettings(settings);
}

function bindSettings() {
  for (const group of document.querySelectorAll('.segmented[data-setting]')) {
    group.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-value]');
      if (btn) updateSetting(group.dataset.setting, btn.dataset.value);
    });
  }
  for (const select of document.querySelectorAll('select[data-setting]')) {
    select.addEventListener('change', () => updateSetting(select.dataset.setting, select.value));
  }
  for (const box of document.querySelectorAll('input[type="checkbox"][data-setting]')) {
    box.addEventListener('change', () => updateSetting(box.dataset.setting, box.checked));
  }
  $('font-smaller').addEventListener('click', () => updateSetting('fontSize', Math.max(60, settings.fontSize - 10)));
  $('font-larger').addEventListener('click', () => updateSetting('fontSize', Math.min(250, settings.fontSize + 10)));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (settings.theme !== 'auto') return;
    applyAppTheme();
    if (current) current.reader.applySettings(settings);
  });
}

// ---------- Toasts ----------

function toast(message, { error = false, timeout = 3500 } = {}) {
  const el = document.createElement('div');
  el.className = `toast${error ? ' error' : ''}`;
  el.textContent = message;
  $('toast-region').appendChild(el);
  setTimeout(() => el.remove(), timeout);
}

// ---------- Library ----------

function hueFor(text) {
  let h = 0;
  for (const ch of text) h = (h * 31 + ch.codePointAt(0)) % 360;
  return h;
}

async function renderLibrary() {
  for (const url of coverUrls) URL.revokeObjectURL(url);
  coverUrls = [];

  const books = await db.listBooks();
  books.sort((a, b) => (b.lastOpened || b.addedAt) - (a.lastOpened || a.addedAt));
  const grid = $('book-grid');
  grid.replaceChildren();
  $('empty-state').hidden = books.length > 0;

  for (const meta of books) {
    const li = document.createElement('li');
    li.className = 'card';

    const open = document.createElement('button');
    open.className = 'card-open';
    open.setAttribute('aria-label', `Open ${meta.title}`);
    open.addEventListener('click', () => { location.hash = `#/book/${meta.id}`; });

    const cover = document.createElement('div');
    cover.className = 'cover';
    if (meta.cover) {
      const img = document.createElement('img');
      const url = URL.createObjectURL(meta.cover);
      coverUrls.push(url);
      img.src = url;
      img.alt = '';
      img.loading = 'lazy';
      cover.appendChild(img);
    } else {
      const hue = hueFor(meta.title);
      const fb = document.createElement('div');
      fb.className = 'cover-fallback';
      fb.style.background = `linear-gradient(160deg, hsl(${hue} 45% 38%), hsl(${(hue + 40) % 360} 50% 22%))`;
      const t = document.createElement('div');
      t.className = 'cf-title';
      t.textContent = meta.title;
      const a = document.createElement('div');
      a.className = 'cf-author';
      a.textContent = meta.author;
      fb.append(t, a);
      cover.appendChild(fb);
    }
    open.appendChild(cover);

    const info = document.createElement('div');
    info.className = 'card-meta';
    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = meta.title;
    const author = document.createElement('div');
    author.className = 'card-author';
    author.textContent = meta.author || 'Unknown author';
    info.append(title, author);

    const pct = Math.round((meta.progress || 0) * 100);
    const progress = document.createElement('div');
    progress.className = 'card-progress';
    if (meta.lastOpened) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      const fill = document.createElement('span');
      fill.style.width = `${pct}%`;
      bar.appendChild(fill);
      const label = document.createElement('span');
      label.textContent = `${pct}%`;
      progress.append(bar, label);
    } else {
      progress.textContent = 'New';
    }
    info.appendChild(progress);
    open.appendChild(info);

    const del = document.createElement('button');
    del.className = 'card-delete';
    del.title = 'Remove from library';
    del.setAttribute('aria-label', `Remove ${meta.title}`);
    del.innerHTML = '<svg class="icon"><use href="#i-trash"/></svg>';
    del.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm(`Remove “${meta.title}” from this device?`)) return;
      await db.deleteBook(meta.id);
      renderLibrary();
    });

    li.append(open, del);
    grid.appendChild(li);
  }
}

async function bookId(buffer, file) {
  try {
    const digest = await crypto.subtle.digest('SHA-256', buffer);
    return [...new Uint8Array(digest)].slice(0, 16).map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch {
    // crypto.subtle needs a secure context; fall back to file attributes.
    return `f-${file.size}-${file.lastModified}-${file.name}`.replace(/[^\w.-]/g, '_');
  }
}

async function importFiles(fileList) {
  const files = [...fileList].filter((f) => /\.epub$/i.test(f.name) || f.type === 'application/epub+zip');
  if (!files.length) {
    toast('Please choose .epub files.', { error: true });
    return [];
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  const added = [];
  for (const file of files) {
    try {
      const buffer = await file.arrayBuffer();
      const id = await bookId(buffer, file);
      if (await db.getBook(id)) {
        toast(`Already in your library: ${file.name}`);
        added.push(id);
        continue;
      }
      const book = await Book.open(buffer);
      const cover = await book.getCoverBlob().catch(() => null);
      await db.addBook({
        id,
        title: book.metadata.title || file.name.replace(/\.epub$/i, ''),
        author: book.metadata.creator,
        cover,
        fileName: file.name,
        size: file.size,
        addedAt: Date.now(),
        lastOpened: 0,
        location: null,
        progress: 0,
      }, new Blob([buffer], { type: 'application/epub+zip' }));
      book.destroy();
      added.push(id);
      toast(`Added “${book.metadata.title}”`);
    } catch (err) {
      console.error(err);
      toast(`Couldn't open ${file.name}: ${err.message}`, { error: true, timeout: 6000 });
    }
  }
  if (added.length && !warnedNotPersistent && !(await db.isPersistent())) {
    warnedNotPersistent = true;
    toast('This browser won’t let Folio save books here, so they’ll be gone when you close the tab. Host Folio on a website to keep a library.', { timeout: 9000 });
  }
  await renderLibrary();
  return added;
}

// ---------- Reader ----------

function flattenToc(items, book, depth = 0, out = []) {
  for (const item of items) {
    out.push({ ...item, depth, spineIndex: item.path ? book.spineIndexOf(item.path) : -1 });
    flattenToc(item.children, book, depth + 1, out);
  }
  return out;
}

function renderToc() {
  const { book } = current;
  const list = $('toc-list');
  list.replaceChildren();
  let n = 0;
  const build = (items) => {
    const ul = document.createElement('ul');
    for (const item of items) {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.textContent = item.label;
      btn.dataset.tocIndex = String(n++);
      if (!item.path || book.spineIndexOf(item.path) < 0) btn.disabled = true;
      btn.addEventListener('click', () => {
        closePanels();
        current.reader.goToHref(item.path, item.fragment).catch(showError);
      });
      li.appendChild(btn);
      if (item.children.length) li.appendChild(build(item.children));
      ul.appendChild(li);
    }
    return ul;
  };
  list.appendChild(build(book.toc));
}

// The TOC entry for a location is the last one that starts at or before it.
function currentTocIndex(index) {
  let best = -1;
  current.tocFlat.forEach((item, i) => {
    if (item.spineIndex < 0 || item.spineIndex > index) return;
    if (item.spineIndex === index && item.fragment && !current.reader.fragmentReached(item.fragment)) return;
    if (best < 0 || item.spineIndex >= current.tocFlat[best].spineIndex) best = i;
  });
  return best;
}

function onRelocate(loc) {
  if (!current) return;
  const { book, cumulative } = current;
  const progress = Math.min(1, (cumulative[loc.index] + loc.fraction * book.spine[loc.index].size) / book.totalSize);
  const pct = Math.round(progress * 100);
  $('progress').value = String(Math.round(progress * 1000));
  $('progress-text').textContent = `${pct}%`;

  const tocIndex = currentTocIndex(loc.index);
  $('chapter-title').textContent = tocIndex >= 0 ? current.tocFlat[tocIndex].label : '';
  for (const btn of $('toc-list').querySelectorAll('button.active')) btn.classList.remove('active');
  const activeBtn = $('toc-list').querySelector(`button[data-toc-index="${tocIndex}"]`);
  if (activeBtn) activeBtn.classList.add('active');

  const info = $('page-info');
  if (settings.flow === 'scrolled') {
    info.textContent = `Section ${loc.index + 1} of ${book.spine.length}`;
    info.title = '';
  } else if (loc.bookPages) {
    info.textContent = `Page ${loc.bookPage} of ${loc.bookPages}`;
    info.title = `Page ${loc.page + 1} of ${loc.pages} in this section`;
  } else {
    // Whole-book numbers appear once every chapter has been laid out.
    info.textContent = `Page ${loc.page + 1} of ${loc.pages} · counting…`;
    info.title = 'Counting pages in the whole book';
  }
  $('btn-prev').disabled = !!loc.atStart;
  $('btn-next').disabled = !!loc.atEnd;

  const { id } = current;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    db.updateBook(id, { location: { index: loc.index, fraction: loc.fraction }, progress, lastOpened: Date.now() });
  }, 400);
}

function showError(err) {
  console.error(err);
  toast(err && err.message ? err.message : String(err), { error: true, timeout: 6000 });
}

async function openBook(id) {
  closeBook();
  showView('reader');
  $('viewer-loading').hidden = false;
  $('book-title').textContent = '';
  $('chapter-title').textContent = '';
  try {
    const meta = await db.getBook(id);
    const blob = meta && await db.getFile(id);
    if (!blob) throw new Error('That book is no longer in your library.');
    const book = await Book.open(await blob.arrayBuffer());

    const cumulative = [];
    book.spine.reduce((sum, s, i) => { cumulative[i] = sum; return sum + s.size; }, 0);
    current = { id, meta, book, cumulative, tocFlat: flattenToc(book.toc, book) };
    document.title = `${meta.title} — Folio`;
    $('book-title').textContent = meta.title;
    renderToc();

    current.reader = new Reader($('viewer'), book, { settings, onRelocate, onError: showError });
    current.reader.setKeyHandler(onKey);
    const start = meta.location || { index: Math.max(0, book.spine.findIndex((s) => s.linear)) };
    await current.reader.display(start);
    db.updateBook(id, { lastOpened: Date.now() });
  } catch (err) {
    showError(err);
    location.hash = '';
  } finally {
    $('viewer-loading').hidden = true;
  }
}

function closeBook() {
  closePanels();
  if (!current) return;
  clearTimeout(saveTimer);
  if (current.reader) {
    const r = current.reader;
    if (r.index >= 0) {
      const progress = Number($('progress').value) / 1000;
      db.updateBook(current.id, { location: { index: r.index, fraction: r.fraction }, progress, lastOpened: Date.now() });
    }
    r.destroy();
  }
  current.book.destroy();
  current = null;
  document.title = 'Folio — EPUB Reader';
}

function seek(overall) {
  if (!current) return;
  const { book, cumulative } = current;
  const target = overall * book.totalSize;
  let index = 0;
  while (index < book.spine.length - 1 && cumulative[index + 1] <= target) index++;
  const fraction = Math.min(0.999, Math.max(0, (target - cumulative[index]) / book.spine[index].size));
  current.reader.display({ index, fraction }).catch(showError);
}

// ---------- Panels ----------

function openPanel(name) {
  const panel = $(name === 'toc' ? 'toc-panel' : 'settings-panel');
  const wasOpen = !panel.hidden;
  closePanels();
  if (wasOpen) return;
  panel.hidden = false;
  $('scrim').hidden = false;
  $(name === 'toc' ? 'btn-toc' : 'btn-settings').setAttribute('aria-expanded', 'true');
  if (name === 'toc') {
    const active = panel.querySelector('button.active');
    if (active) active.scrollIntoView({ block: 'center' });
    (active || panel.querySelector('button:not([data-close])'))?.focus();
  } else {
    panel.querySelector('button, select, input')?.focus();
  }
}

function closePanels() {
  $('toc-panel').hidden = true;
  $('settings-panel').hidden = true;
  $('scrim').hidden = true;
  $('btn-toc').setAttribute('aria-expanded', 'false');
  $('btn-settings').setAttribute('aria-expanded', 'false');
}

function panelsOpen() {
  return !$('toc-panel').hidden || !$('settings-panel').hidden;
}

// ---------- Keyboard ----------

function onKey(e) {
  if (!current || $('reader-view').hidden) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') {
    if (e.key === 'Escape') closePanels();
    return;
  }
  if (e.key === 'Escape') {
    if (panelsOpen()) { closePanels(); e.preventDefault(); }
    return;
  }
  if (panelsOpen()) return;
  const paginated = settings.flow !== 'scrolled';
  switch (e.key) {
    case 'ArrowRight':
    case 'PageDown':
      e.preventDefault(); current.reader.next(); break;
    case 'ArrowLeft':
    case 'PageUp':
      e.preventDefault(); current.reader.prev(); break;
    case ' ':
      e.preventDefault();
      if (e.shiftKey) current.reader.prev(); else current.reader.next();
      break;
    case 'ArrowDown':
      if (paginated) { e.preventDefault(); current.reader.next(); }
      break;
    case 'ArrowUp':
      if (paginated) { e.preventDefault(); current.reader.prev(); }
      break;
    case 't':
    case 'T':
      openPanel('toc'); break;
    default:
  }
}

// ---------- Routing & views ----------

function showView(name) {
  $('library-view').hidden = name !== 'library';
  $('reader-view').hidden = name !== 'reader';
}

async function route() {
  const match = location.hash.match(/^#\/book\/(.+)$/);
  if (match) {
    const id = decodeURIComponent(match[1]);
    if (!current || current.id !== id) await openBook(id);
  } else {
    closeBook();
    showView('library');
    await renderLibrary();
  }
}

// ---------- Drag & drop, file handling ----------

function bindDragDrop() {
  let depth = 0;
  const overlay = $('drop-overlay');
  const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    depth++;
    overlay.hidden = false;
  });
  window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', () => {
    depth = Math.max(0, depth - 1);
    if (!depth) overlay.hidden = true;
  });
  window.addEventListener('drop', async (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    depth = 0;
    overlay.hidden = true;
    const ids = await importFiles(e.dataTransfer.files);
    if (ids.length === 1 && $('library-view').hidden === false) location.hash = `#/book/${ids[0]}`;
  });

  // Installed app on desktop: "Open with Folio" from the file manager.
  if ('launchQueue' in window) {
    window.launchQueue.setConsumer(async (params) => {
      if (!params.files || !params.files.length) return;
      const files = await Promise.all(params.files.map((h) => h.getFile()));
      const ids = await importFiles(files);
      if (ids.length) location.hash = `#/book/${ids[0]}`;
    });
  }
}

// ---------- Offline support ----------

function registerServiceWorker() {
  const status = $('offline-status');
  const show = (icon, text) => {
    status.innerHTML = `<svg class="icon"><use href="#${icon}"/></svg>`;
    status.append(text);
    status.hidden = false;
  };
  const refresh = () => {
    if (!navigator.onLine) show('i-cloud-off', 'Offline');
    else if (navigator.serviceWorker && navigator.serviceWorker.controller) show('i-check', 'Works offline');
    else status.hidden = true;
  };
  window.addEventListener('online', refresh);
  window.addEventListener('offline', refresh);

  // Opened straight from disk (single-file build): nothing to cache, already offline.
  if (location.protocol === 'file:') { show('i-check', 'Works offline'); return; }
  if (!('serviceWorker' in navigator)) { refresh(); return; }
  navigator.serviceWorker.register('sw.js').then((reg) => {
    reg.addEventListener('updatefound', () => {
      const worker = reg.installing;
      worker && worker.addEventListener('statechange', () => {
        if (worker.state === 'installed' && navigator.serviceWorker.controller) {
          toast('An update is ready — it will be used next time you open Folio.', { timeout: 6000 });
        }
      });
    });
  }).catch((err) => console.warn('Service worker registration failed', err));
  navigator.serviceWorker.addEventListener('controllerchange', refresh);
  navigator.serviceWorker.ready.then(refresh);
  refresh();
}

// ---------- Init ----------

function init() {
  applyAppTheme();
  syncSettingsUI();
  bindSettings();
  bindDragDrop();

  $('file-input').addEventListener('change', async (e) => {
    const ids = await importFiles(e.target.files);
    e.target.value = '';
    if (ids.length === 1) location.hash = `#/book/${ids[0]}`;
  });
  $('btn-library').addEventListener('click', () => { location.hash = ''; });
  $('btn-toc').addEventListener('click', () => openPanel('toc'));
  $('btn-settings').addEventListener('click', () => openPanel('settings'));
  $('scrim').addEventListener('click', closePanels);
  for (const btn of document.querySelectorAll('[data-close]')) btn.addEventListener('click', closePanels);
  $('btn-prev').addEventListener('click', () => current && current.reader.prev());
  $('btn-next').addEventListener('click', () => current && current.reader.next());
  $('progress').addEventListener('input', (e) => {
    $('progress-text').textContent = `${Math.round(Number(e.target.value) / 10)}%`;
  });
  $('progress').addEventListener('change', (e) => seek(Number(e.target.value) / 1000));
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', route);
  window.addEventListener('pagehide', () => {
    if (current && current.reader.index >= 0) {
      db.updateBook(current.id, { location: { index: current.reader.index, fraction: current.reader.fraction } });
    }
  });

  registerServiceWorker();
  route();
}

init();

return {  };
})();
})();
</script>
</body>
